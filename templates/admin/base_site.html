{% extends "admin/base.html" %}

{% block title %}{% if subtitle %}{{ subtitle }} | {% endif %}{{ title }} | Fasthome{% endblock %}

{% block branding %}
<h1 id="site-name"><a href="{% url 'admin:index' %}"><span class="fh-mark">F</span><span>Fasthome</span><small>Administration</small></a></h1>
{% endblock %}

{% block extrahead %}
{{ block.super }}
<style>
:root{--fh-navy:#123b63;--fh-navy-2:#0d2d4b;--fh-blue:#1d5d8f;--fh-bg:#f4f7fb;--fh-card:#fff;--fh-text:#172b3d;--fh-muted:#64748b;--fh-border:#dfe7ef;--fh-green:#18815b;--fh-shadow:0 6px 18px rgba(18,59,99,.07)}
html,body{background:var(--fh-bg)!important;color:var(--fh-text)}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif!important;font-size:14px!important}
#header{background:linear-gradient(135deg,var(--fh-navy-2),var(--fh-navy))!important;color:#fff!important;padding:0 24px!important;box-shadow:0 3px 14px rgba(0,0,0,.1)}
#branding h1{margin:0!important;padding:14px 0!important;font-size:21px!important;line-height:1.1!important}#branding h1 a{display:flex;align-items:center;gap:9px;color:#fff!important;text-decoration:none!important;font-weight:800!important}#branding h1 small{font-size:10px;font-weight:500;opacity:.7;margin-left:3px}.fh-mark{width:32px;height:32px;border-radius:9px;background:#fff;color:var(--fh-navy);display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:19px}
#user-tools{padding:10px 0!important;font-size:12px!important;color:#dbeafe!important}#user-tools a{color:#fff!important;text-decoration:none!important;font-weight:600}#user-tools button{background:rgba(255,255,255,.1)!important;border:1px solid rgba(255,255,255,.22)!important;color:#fff!important;border-radius:7px!important;padding:5px 9px!important}
.breadcrumbs{background:#fff!important;border-bottom:1px solid var(--fh-border)!important;color:var(--fh-muted)!important;padding:10px 24px!important}.breadcrumbs a{color:var(--fh-blue)!important;font-weight:700!important}.main{background:var(--fh-bg)!important}.content{max-width:1440px!important;margin:0 auto!important;padding:22px 24px 36px!important}#content{width:auto!important;max-width:none!important}#content h1{font-size:28px!important;color:var(--fh-text)!important;font-weight:800!important}
.module{background:var(--fh-card)!important;border:1px solid var(--fh-border)!important;border-radius:14px!important;box-shadow:var(--fh-shadow)!important;overflow:hidden!important;margin-bottom:16px!important}.module caption{background:var(--fh-navy)!important;color:#fff!important;padding:12px 14px!important;text-align:left!important;font-size:15px!important;font-weight:800!important}.module caption a.section{color:#fff!important;text-decoration:none!important}.module table{width:100%!important}.module th,.module td{padding:10px 12px!important;border-top:1px solid var(--fh-border)!important}.module th a{color:var(--fh-text)!important;text-decoration:none!important}.module td{text-align:right!important}.module td a{border-radius:7px!important;padding:5px 8px!important;text-decoration:none!important;font-weight:700!important}.module td .addlink{color:#fff!important;background:var(--fh-green)!important}.module td .changelink,.module td .viewlink{color:var(--fh-blue)!important;background:#edf5fb!important}
#content-related{background:#fff!important;border:1px solid var(--fh-border)!important;border-radius:14px!important;box-shadow:var(--fh-shadow)!important;overflow:hidden!important;margin-top:18px!important}#content-related h2,#content-related h3{margin:0!important;padding:12px 14px!important;background:#f7fafc!important;color:var(--fh-text)!important}.actionlist{margin:0!important;padding:0 14px!important;list-style:none!important}.actionlist li{padding:9px 0!important;border-bottom:1px solid var(--fh-border)!important}.actionlist a{color:var(--fh-blue)!important;font-weight:700!important;text-decoration:none!important}
input,select,textarea{border:1px solid #cbd5e1!important;border-radius:8px!important;padding:8px 9px!important;background:#fff!important;color:var(--fh-text)!important}button,.button,input[type=submit],input[type=button]{border-radius:8px!important;font-weight:700!important}
@media(max-width:800px){#header{padding:0 13px!important}#branding h1{padding:12px 0!important;font-size:18px!important}#branding h1 small{display:none}#user-tools{padding:7px 0 10px!important;font-size:11px!important}.breadcrumbs{padding:8px 13px!important}.content{padding:14px 10px 24px!important}#content h1{font-size:23px!important}.module{border-radius:11px!important;margin-bottom:12px!important}.module caption{font-size:14px!important;padding:11px!important}.module th,.module td{padding:8px 7px!important;font-size:12px!important}.module td a{padding:4px 6px!important;font-size:11px!important}}
</style>
{% endblock %}
