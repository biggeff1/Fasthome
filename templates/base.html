<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Fasthome{% endblock %}</title><style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18212b;background:#f7f8fa}*{box-sizing:border-box}body{margin:0}.nav{position:sticky;top:0;background:#fff;border-bottom:1px solid #e7eaf0;z-index:10}.nav-inner{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:10px}.brand{font-weight:800;font-size:1.15rem;color:#123;text-decoration:none}.nav-spacer{flex:1}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:10px;padding:11px 15px;text-decoration:none;cursor:pointer;font-weight:700}.btn-primary{background:#163a5f;color:#fff}.btn-light{background:#eef2f6;color:#18344d}.container{max-width:1180px;margin:auto;padding:28px 18px}.hero{padding:48px 0 34px;text-align:center}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:.2em 0}.hero p{max-width:700px;margin:0 auto 24px;color:#5b6673}.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.section{padding:28px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:#fff;border:1px solid #e7eaf0;border-radius:16px;overflow:hidden}.card-body{padding:16px}.photo{aspect-ratio:4/3;background:#e9edf2;display:flex;align-items:center;justify-content:center;color:#7a8592;overflow:hidden}.muted{color:#6d7782}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#edf4ef;color:#24613f;font-size:.8rem;font-weight:700}.form{max-width:900px;margin:auto;background:#fff;border:1px solid #e7eaf0;border-radius:18px;padding:24px}.field{display:grid;gap:7px;margin-bottom:14px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #ccd4dc;border-radius:10px;background:#fff}.row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.alert{padding:12px 14px;border-radius:10px;background:#fff4d9;margin:12px 0}.list{display:grid;gap:12px}.list-item{background:#fff;border:1px solid #e7eaf0;border-radius:14px;padding:16px}@media(max-width:760px){.nav-inner{flex-wrap:wrap}.nav-spacer{display:none}.row{grid-template-columns:1fr}.nav .btn{padding:9px 10px;font-size:.88rem}}
</style></head><body>
<nav class="nav"><div class="nav-inner"><a class="brand" href="{% url 'home' %}">FASTHOME</a><div class="nav-spacer"></div><a href="{% url 'matching' %}" class="btn btn-light">🔎 Rechercher</a><a href="{% url 'property_create' %}" class="btn btn-primary">🏠 Publier</a>{% if request.user.is_authenticated %}<a href="{% url 'notifications' %}" class="btn btn-light">🔔</a><a href="{% url 'activity' %}" class="btn btn-light">Mon activité</a><a href="{% url 'profile' %}" class="btn btn-light">👤</a>{% else %}<a href="{% url 'login' %}" class="btn btn-light">Connexion</a><a href="{% url 'register' %}" class="btn btn-light">Créer un compte</a>{% endif %}</div></nav>
{% if messages %}<div class="container">{% for message in messages %}<div class="alert">{{ message }}</div>{% endfor %}</div>{% endif %}{% block content %}{% endblock %}
</body></html>
