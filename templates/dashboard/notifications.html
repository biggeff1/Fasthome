{% extends 'base.html' %}{% block title %}Notifications — Fasthome{% endblock %}{% block content %}<main class="container"><h1>🔔 Notifications</h1><div class="list">{% for n in items %}<div class="list-item"><span class="badge">{{ n.get_level_display }}</span><h3>{{ n.title }}</h3><p>{{ n.message }}</p><small class="muted">{{ n.created_at }}</small></div>{% empty %}<p class="muted">Aucune notification.</p>{% endfor %}</div></main>{% endblock %}
